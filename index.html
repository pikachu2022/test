<!DOCTYPE html>
<html>
	<head>
		<title>測試</title>
		<meta charset="UTF-8">
		<link rel='stylesheet' href='style.css'>
	</head>
	<body>
		<div id="val0">
			<span id="val1">
				值1：
				<input type="number">
				<select onchange='
					var val1 = this.selectedOptions[0].innerText;
					document.querySelector("p").innerText = val1;
				'>
					<option>千</option>
					<option selected> </option>
					<option>毫</option>
					<option>微</option>
					<option>奈</option>
					<option>皮</option>
				</select>
			</span>
			<br>
			<span id="val2">
				值2：
				<input type="number">
				<select onchange='
					var val1 = this.selectedOptions[0].innerText;
					document.querySelector("p").innerText = val1;
				'>
					<option>千</option>
					<option selected> </option>
					<option>毫</option>
					<option>微</option>
					<option>奈</option>
					<option>皮</option>
				</select>
			</span>
		</div>
		<div>
			<span>
				<p></p>
			</span>
		</div>
		<script>
			let data = [
				{name:'千',val:Math.pow(10,3)},
				{name:' ',val:Math.pow(10,0)},
				{name:'毫',val:Math.pow(10,-3)},
				{name:'微',val:Math.pow(10,-6)},
				{name:'奈',val:Math.pow(10,-9)},
				{name:'皮',val:Math.pow(10,-12)},
			]
			var k;
			document.querySelector("#val0").addEventListener("change",function(){
				k = this.querySelector("#val1").querySelector("select").selectedOptions[0].innerText;
				data.forEach(function(val){
					if(val.name==k){
						k = val.val;
					}
				})
				var a = parseFloat(this.querySelector("#val1").querySelector("input").value) * k;
				k = this.querySelector("#val2").querySelector("select").selectedOptions[0].innerText;
				data.forEach(function(val){
					if(val.name==k){
						k = val.val;
					}
				})
				var b = parseFloat(this.querySelector("#val2").querySelector("input").value) * k;
				if(a > b){
				console.log(a+"\t"+b);
					var temp = 0;
					temp = a;
					a = b;
					b = temp;
				}
				var c = Math.round(1000*100*((1/a)-(1/b))/(1/a))/1000;
				document.querySelector("p").innerText="max:\t"+1/a+"\nmin:\t"+1/b+"\nresp:\t"+c+"%";
			})
		</script>
	</body>
</html>
